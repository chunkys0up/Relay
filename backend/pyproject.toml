[project]
name = "relay-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "strands-harness==0.1.2",
    "strands-agents==1.57.2",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "boto3>=1.43.108",
    "python-multipart>=0.0.32",
    "asyncpg>=0.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
